<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Suits World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="faq.html">FAQ & Size Guide</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <div class="contact-info">
                <p><strong>Address:</strong> 123 Suits Avenue, Harare, Zimbabwe</p>
                <p><strong>Phone:</strong> +263 123 456 789</p>
                <p><strong>Email:</strong> info@suitsworld.co.zw</p>
            </div>
            <form class="contact-form" method="post" action='https://demoEmail.suitsWorld.co.zw'>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" pattern="[^0-9]*" title="Name cannot contain numbers" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Suits World. All rights reserved.</p>
    </footer>
</body>
</html>
